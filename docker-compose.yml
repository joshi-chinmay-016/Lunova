version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lunova-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lunova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lunovapassword}
      POSTGRES_DB: ${POSTGRES_DB:-lunovadb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lunova} -d ${POSTGRES_DB:-lunovadb}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
